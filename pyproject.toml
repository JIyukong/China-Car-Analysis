[project]
name = "carapp"
version = "0.1.0"
requires-python = ">=3.11"
description = "中国乘用车投资分析平台"

[tool.setuptools.packages.find]
where = ["."]
include = ["base_infra*", "backend*", "pipelines*", "scheduler*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["base_infra", "backend", "pipelines", "scheduler"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
