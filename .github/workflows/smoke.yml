name: Smoke tests

on:
  pull_request:
  push:
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    name: CarApp smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -X utf8 -m scheduler.runner --plan
      - run: python -X utf8 -m pytest
